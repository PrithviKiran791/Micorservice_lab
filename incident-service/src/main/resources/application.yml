# incident-service configuration. Everything comes from environment variables.
# For local runs use the "local" profile (application-local.yml), which holds DEMO values only.
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: incident-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update          # dev/lab only (rule R-DB-1); Flyway is future work
    open-in-view: false

  # RabbitMQ: host/port/user/password come from SPRING_RABBITMQ_* env vars (Spring Boot reads them by itself);
  # defaults are localhost:5672 guest/guest, which matches docker-compose.
  rabbitmq:
    connection-timeout: 2s      # a dead broker must not stall incident creation

# The synchronous dependency: responder-service, found BY NAME through Eureka (see config/RestClientConfig).
responder:
  service:
    url: ${RESPONDER_SERVICE_URL:http://responder-service}   # "responder-service" is a registry name, not a DNS host
    connect-timeout-ms: 1000    # rule R-RS-1: connect <= 1 s
    read-timeout-ms: 2000       # rule R-RS-1: read <= 2 s

# Circuit breaker "responderService" (hard idea #2), used by client/ResponderClient.
resilience4j:
  circuitbreaker:
    instances:
      responderService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5                      # judge the last 5 calls
        minimum-number-of-calls: 3                  # need at least 3 calls before judging
        failure-rate-threshold: 50                  # open when >= 50 % of them failed
        wait-duration-in-open-state: 10s            # stay open (fail fast) for 10 s
        permitted-number-of-calls-in-half-open-state: 2   # then let 2 probe calls through
        automatic-transition-from-open-to-half-open-enabled: true
        # Only real infrastructure problems count as failures. A business answer such as
        # 409 NO_RESPONDER_AVAILABLE (a 4xx) is NOT a failure (rule R-RS-2).
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException    # refused / timeout
          - org.springframework.web.client.HttpServerErrorException   # responder answered 5xx

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db   # not Ready until the database answers (R-RS-4)

# Service discovery (Eureka). Each service registers itself and sends a heartbeat every 5 s;
# if heartbeats stop for 15 s the registry removes it (graceful shutdowns de-register at once).
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}   # in Kubernetes: http://discovery-service:8761/eureka
    registry-fetch-interval-seconds: 5      # how often this service refreshes its copy of the registry
  instance:
    prefer-ip-address: true                 # register the pod IP (pod names are not resolvable by other pods)
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
# Spring Cloud LoadBalancer keeps a copy of the instance list; refresh it quickly so scale up/down is noticed.
spring.cloud.loadbalancer.cache.ttl: 5s