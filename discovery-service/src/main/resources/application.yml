# discovery-service (Eureka registry). Dashboard: http://localhost:8761
server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false   # the registry does not register itself with itself
    fetch-registry: false
  server:
    enable-self-preservation: false          # lab setting: really evict dead instances (see lease times in the clients)
    eviction-interval-timer-in-ms: 5000      # look for expired instances every 5 s
    response-cache-update-interval-ms: 3000  # publish changes to clients quickly

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true