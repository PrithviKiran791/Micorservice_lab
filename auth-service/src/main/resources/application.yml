# auth-service configuration. Everything comes from environment variables.
# For local runs use the "local" profile (application-local.yml), which holds DEMO values only.
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update     # dev/lab only (rule R-DB-1); Flyway is future work
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}                    # at least 32 characters, no default on purpose (R-SE-6)
  issuer: ${JWT_ISSUER:resqnet-auth}
  expiry-minutes: ${JWT_EXPIRY_MINUTES:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true      # adds /actuator/health/liveness and /readiness
      group:
        readiness:
          include: readinessState,db   # not Ready until the database answers (R-RS-4)

# Service discovery (Eureka). Each service registers itself and sends a heartbeat every 5 s;
# if heartbeats stop for 15 s the registry removes it (graceful shutdowns de-register at once).
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}   # in Kubernetes: http://discovery-service:8761/eureka
    registry-fetch-interval-seconds: 5      # how often this service refreshes its copy of the registry
  instance:
    prefer-ip-address: true                 # register the pod IP (pod names are not resolvable by other pods)
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15