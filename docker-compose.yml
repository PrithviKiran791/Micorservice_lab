# Local infrastructure only: PostgreSQL (4 databases) + RabbitMQ.
# All passwords below are DEMO values for local development. Never reuse them for anything real.
services:
  postgres:
    image: postgres:16
    container_name: resqnet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-demo
      AUTH_DB_PASSWORD: auth-demo
      INCIDENT_DB_PASSWORD: incident-demo
      RESPONDER_DB_PASSWORD: responder-demo
      NOTIFICATION_DB_PASSWORD: notification-demo
    ports:
      - "5433:5432"   # 5433 on the host because a local Postgres may already own 5432
    volumes:
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: resqnet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
