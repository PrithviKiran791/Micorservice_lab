# notification-service: consumes incident events from RabbitMQ (async), stores notifications and serves them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: resqnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      # Wait until PostgreSQL accepts connections, so the app does not crash and restart while the database boots.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U postgres; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-rabbitmq
          image: postgres:16                 # only used for its bash; checks that port 5672 accepts connections
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "until (echo > /dev/tcp/rabbitmq/5672) 2>/dev/null; do echo waiting for rabbitmq; sleep 2; done"]
      containers:
        - name: notification-service
          image: resqnet/notification-service:1.0
          imagePullPolicy: IfNotPresent      # images are loaded into Minikube, never pulled (rule R-K8-2)
          ports:
            - containerPort: 8084
          env:
            - name: EUREKA_URL
              valueFrom: { configMapKeyRef: { name: resqnet-config, key: EUREKA_URL } }
            - name: JAVA_TOOL_OPTIONS         # small, quick-starting JVM so everything fits in the cluster (R-K8-6): heap cap, serial GC, C1 compiler only, small stacks
              value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/notification_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "notification_user"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: resqnet-secrets, key: NOTIFICATION_DB_PASSWORD } }
            - name: SPRING_RABBITMQ_HOST
              valueFrom: { configMapKeyRef: { name: resqnet-config, key: SPRING_RABBITMQ_HOST } }
            - name: SPRING_RABBITMQ_PORT
              valueFrom: { configMapKeyRef: { name: resqnet-config, key: SPRING_RABBITMQ_PORT } }
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom: { secretKeyRef: { name: resqnet-secrets, key: RABBITMQ_DEFAULT_USER } }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: resqnet-secrets, key: RABBITMQ_DEFAULT_PASS } }
          # startupProbe gives the JVM time to boot; after it succeeds the other two probes take over.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 5
            failureThreshold: 90
          # liveness: "is the process alive?"  If it fails, Kubernetes restarts the container.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 10
            failureThreshold: 3
          # readiness: "can it serve traffic?"  If it fails, the pod is removed from the Service.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: resqnet
spec:
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
