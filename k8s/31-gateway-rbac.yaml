# Read-only access for the api-gateway to the cluster state of ITS OWN namespace, so the administrator dashboard
# (GET /api/ops/kubernetes) can show deployments, replica counts, pod status and service exposure.
# Deliberately NOT granted: secrets, configmaps, any write verb, any other namespace, cluster-wide resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: resqnet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-reader
  namespace: resqnet
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway-ops-reader
  namespace: resqnet
subjects:
  - kind: ServiceAccount
    name: api-gateway
    namespace: resqnet
roleRef:
  kind: Role
  name: ops-reader
  apiGroup: rbac.authorization.k8s.io
