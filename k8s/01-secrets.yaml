# !!! DEMO SECRETS FOR THE LAB ONLY !!!
# These values are public in Git and MUST NOT be reused for anything real (rule R-GT-3).
# A Secret keeps passwords out of the images and out of the Deployment files.
# stringData lets us write plain text; Kubernetes stores it base64-encoded.
apiVersion: v1
kind: Secret
metadata:
  name: resqnet-secrets
  namespace: resqnet
type: Opaque
stringData:
  JWT_SECRET: "demo-k8s-jwt-secret-0123456789-abcdef-not-for-real-use"   # same value for auth-service and api-gateway
  POSTGRES_PASSWORD: "postgres-demo"
  AUTH_DB_PASSWORD: "auth-demo"
  INCIDENT_DB_PASSWORD: "incident-demo"
  RESPONDER_DB_PASSWORD: "responder-demo"
  NOTIFICATION_DB_PASSWORD: "notification-demo"
  RABBITMQ_DEFAULT_USER: "resqnet"
  RABBITMQ_DEFAULT_PASS: "rabbit-demo"
