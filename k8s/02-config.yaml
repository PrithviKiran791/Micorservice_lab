# Non-secret configuration. Services find each other by Kubernetes DNS name (the Service name).
apiVersion: v1
kind: ConfigMap
metadata:
  name: resqnet-config
  namespace: resqnet
data:
  JWT_ISSUER: "resqnet-auth"
  JWT_EXPIRY_MINUTES: "120"
  EUREKA_URL: "http://discovery-service:8761/eureka"        # the registry; every service registers here and looks others up by name
  RESPONDER_SERVICE_URL: "http://responder-service"          # a registry NAME (resolved by Eureka + load balancer), not a DNS host
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
---
# Copy of db/init-databases.sh (keep the two in sync). Postgres runs it once, on first start with an
# empty data volume: it creates the four databases and four users (database-per-service).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: resqnet
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
        CREATE USER auth_user         WITH PASSWORD '${AUTH_DB_PASSWORD}';
        CREATE USER incident_user     WITH PASSWORD '${INCIDENT_DB_PASSWORD}';
        CREATE USER responder_user    WITH PASSWORD '${RESPONDER_DB_PASSWORD}';
        CREATE USER notification_user WITH PASSWORD '${NOTIFICATION_DB_PASSWORD}';

        CREATE DATABASE auth_db         OWNER auth_user;
        CREATE DATABASE incident_db     OWNER incident_user;
        CREATE DATABASE responder_db    OWNER responder_user;
        CREATE DATABASE notification_db OWNER notification_user;

        REVOKE CONNECT ON DATABASE auth_db, incident_db, responder_db, notification_db FROM PUBLIC;
    EOSQL
