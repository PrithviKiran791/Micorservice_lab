# notification-service configuration. Everything comes from environment variables.
# For local runs use the "local" profile (application-local.yml), which holds DEMO values only.
server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update          # dev/lab only (rule R-DB-1); Flyway is future work
    open-in-view: false
  # RabbitMQ host/port/user/password come from SPRING_RABBITMQ_* env vars (Spring Boot reads them itself);
  # defaults are localhost:5672 guest/guest, which matches docker-compose.
  rabbitmq:
    listener:
      simple:
        # A message that fails (for example malformed) is dropped, not put back in the queue forever.
        # (Stretch: send such messages to a dead-letter queue instead.)
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
        # metrics: request counters per pod (cluster-internal only; the gateway has no route to /actuator)
  endpoint:
    health:
      show-components: always   # component NAMES and UP/DOWN only (db, rabbit ...); show-details stays off, so no connection data
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db   # ready = database reachable. The broker is deliberately not included,
                                       # so a RabbitMQ outage does not make GET /notifications unavailable.

# Service discovery (Eureka). Each service registers itself and sends a heartbeat every 5 s;
# if heartbeats stop for 15 s the registry removes it (graceful shutdowns de-register at once).
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}   # in Kubernetes: http://discovery-service:8761/eureka
    registry-fetch-interval-seconds: 5      # how often this service refreshes its copy of the registry
  instance:
    prefer-ip-address: true                 # register the pod IP (pod names are not resolvable by other pods)
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15